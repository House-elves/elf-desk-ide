name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libx11-dev libxkbfile-dev rpm
      - run: npm ci
      - run: npm run build
      - name: Package
        working-directory: electron-app
        run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: elf-desk-${{ runner.os }}
          path: |
            electron-app/dist/*.AppImage
            electron-app/dist/*.deb
            electron-app/dist/*.rpm
            electron-app/dist/*.dmg
            electron-app/dist/*.exe
          if-no-files-found: error
          retention-days: 14
